<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/admin/lmax27.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Partners</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <style>
    .partner-table-wrap { overflow-x:auto; }
    .partner-table { width:100%; border-collapse:collapse; }
    .partner-table th { padding:10px 14px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text3); border-bottom:1px solid var(--border); background:var(--bg3); }
    .partner-table td { padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:top; font-size:13px; }
    .partner-table tr:hover td { background:rgba(245,197,24,0.03); }
    .role-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
    .role-owner   { background:rgba(245,197,24,0.15); color:#f5c518; border:1px solid rgba(245,197,24,0.35); }
    .role-partner { background:rgba(52,211,153,0.12); color:#34d399; border:1px solid rgba(52,211,153,0.3); }
    .pname { font-weight:700; color:var(--text); font-size:14px; }
    .pmeta { font-size:11px; color:var(--text3); margin-top:2px; font-family:monospace; }
    .app-tag { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:5px; font-size:11px; font-weight:600; background:var(--bg3); border:1px solid var(--border); color:var(--text2); margin:2px; }
    .app-tag .perms { font-size:9px; color:var(--text3); }
    .limit-bar-wrap { margin-top:3px; }
    .limit-bar { height:4px; border-radius:2px; background:var(--bg4); overflow:hidden; }
    .limit-bar-fill { height:100%; border-radius:2px; background:var(--accent); transition:width .3s; }
    .limit-bar-fill.warn { background:#ef4444; }
    .section-sep { font-size:10px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.8px; margin:16px 0 8px; padding-bottom:4px; border-bottom:1px solid rgba(245,197,24,0.1); }
    .app-perm-row { display:grid; grid-template-columns:1fr auto; align-items:start; gap:12px; padding:12px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; }
    .app-perm-row.disabled { opacity:.5; }
    .perm-checks { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .perm-check-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text2); cursor:pointer; }
    .perm-check-item input { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }
    .key-limit-wrap { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11px; color:var(--text3); }
    .key-limit-inp { width:72px; padding:4px 8px; background:var(--bg4); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:11px; outline:none; }
    .key-limit-inp:focus { border-color:var(--accent); }
    .toggle-app-btn { background:none; border:1px solid var(--border); border-radius:4px; width:28px; height:28px; cursor:pointer; color:var(--text3); font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
    .toggle-app-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  </style>
</head>
<body>
<div id="particles"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Partners</div>
        <div class="topbar-sub">Control total de acceso, roles y limites por partner</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openModal('modal-create')">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
          Nuevo Partner
        </button>
      </div>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="4.5" cy="4" r="2.2" stroke="#f5c518" stroke-width="1.3"/><circle cx="9.5" cy="4" r="2.2" stroke="#f5c518" stroke-width="1.3"/><path d="M1 12c0-2 1.5-3.2 3.5-3.2M13 12c0-2-1.5-3.2-3.5-3.2M7 8.8c2 0 3.5 1.2 3.5 3.2H3.5C3.5 10 5 8.8 7 8.8z" stroke="#f5c518" stroke-width="1.3" stroke-linecap="round"/></svg>
            Lista de Partners
          </div>
        </div>
        <div class="partner-table-wrap">
          <table class="partner-table">
            <thead>
              <tr>
                <th>Partner</th>
                <th>Rol</th>
                <th>Apps Asignadas</th>
                <th>Estado</th>
                <th>Ultimo Acceso</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="partners-tbody">
              <tr><td colspan="6"><div class="empty-state"><div class="loader"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Crear Partner -->
<div class="modal-overlay" id="modal-create">
  <div class="modal" style="max-width:600px;max-height:90vh;overflow-y:auto;">
    <div class="modal-header">
      <div class="modal-title">Nuevo Partner</div>
      <button class="modal-close" onclick="closeModal('modal-create')">✕</button>
    </div>
    <div class="section-sep">Datos de acceso</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Usuario *</label><input type="text" id="new-username" class="form-control" placeholder="username" /></div>
      <div class="form-group"><label class="form-label">Contrasena *</label><input type="password" id="new-password" class="form-control" placeholder="contrasena" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Nombre visible</label><input type="text" id="new-display" class="form-control" placeholder="Mi Partner" /></div>
      <div class="form-group"><label class="form-label">Rol</label>
        <select id="new-role" class="form-control">
          <option value="partner">Partner</option>
          <option value="owner">Owner</option>
        </select>
      </div>
    </div>
    <div class="section-sep">Apps y permisos</div>
    <div id="new-apps-list"><div class="empty-state" style="padding:12px;"><div class="loader"></div></div></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-create')">Cancelar</button>
      <button class="btn btn-primary" onclick="createPartner()">Crear Partner</button>
    </div>
  </div>
</div>

<!-- Modal Editar Partner -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal" style="max-width:600px;max-height:90vh;overflow-y:auto;">
    <div class="modal-header">
      <div class="modal-title">Editar Partner</div>
      <button class="modal-close" onclick="closeModal('modal-edit')">✕</button>
    </div>
    <input type="hidden" id="edit-id" />
    <div class="section-sep">Datos de acceso</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Usuario</label><input type="text" id="edit-username" class="form-control" readonly style="opacity:.5;" /></div>
      <div class="form-group"><label class="form-label">Nueva Contrasena</label><input type="password" id="edit-password" class="form-control" placeholder="dejar vacio = no cambiar" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Nombre visible</label><input type="text" id="edit-display" class="form-control" /></div>
      <div class="form-group"><label class="form-label">Rol</label>
        <select id="edit-role" class="form-control">
          <option value="partner">Partner</option>
          <option value="owner">Owner</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Estado</label>
        <select id="edit-active" class="form-control">
          <option value="1">Activo</option>
          <option value="0">Desactivado</option>
        </select>
      </div>
    </div>
    <div class="section-sep">Apps y permisos</div>
    <div id="edit-apps-list"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-edit')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit()">Guardar Cambios</button>
    </div>
  </div>
</div>

<!-- Modal Limites -->
<div class="modal-overlay" id="modal-limits">
  <div class="modal" style="max-width:500px;">
    <div class="modal-header">
      <div class="modal-title">Limites de Keys — <span id="limits-pname" style="color:var(--accent);"></span></div>
      <button class="modal-close" onclick="closeModal('modal-limits')">✕</button>
    </div>
    <div id="limits-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal('modal-limits')">Cerrar</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/admin/js/app.js"></script>
<script src="/admin/js/sidebar.js"></script>
<script>
var allApps = [];

(async function() {
  injectSidebar('partners');
  await requireAuth();
  var ar = await apiFetch(API + '/apps');
  if (ar && ar.success) allApps = ar.apps;
  buildAppPerms('new-apps-list', []);
  loadPartners();
})();

async function loadPartners() {
  var res = await apiFetch(API + '/partners');
  var tbody = document.getElementById('partners-tbody');
  if (!res || !res.success) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>Error cargando partners</p></div></td></tr>';
    return;
  }
  if (!res.partners || !res.partners.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>Sin partners aun. Crea el primero.</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = res.partners.map(function(p) {
    var role = p.role || 'partner';
    var roleBadge = role === 'owner'
      ? '<span class="role-badge role-owner">Owner</span>'
      : '<span class="role-badge role-partner">Partner</span>';
    var statusBadge = p.active
      ? '<span class="badge badge-green">Activo</span>'
      : '<span class="badge badge-red">Inactivo</span>';
    var appTags = p.apps && p.apps.length
      ? p.apps.map(function(a) {
          var perms = [];
          if (a.can_genkeys) perms.push('Keys');
          if (a.can_users)   perms.push('Users');
          if (a.can_logs)    perms.push('Logs');
          var limitHtml = '';
          if (a.key_limit > 0) {
            var pct = Math.min(100, Math.round(((a.keys_used||0) / a.key_limit) * 100));
            var isFull = pct >= 90;
            limitHtml = '<div class="limit-bar-wrap"><div style="font-size:9px;color:var(--text3);margin-bottom:2px;">'+(a.keys_used||0)+'/'+a.key_limit+' keys</div>'
              + '<div class="limit-bar"><div class="limit-bar-fill'+(isFull?' warn':'')+'" style="width:'+pct+'%"></div></div></div>';
          }
          return '<span class="app-tag">'
            + esc(a.name)
            + (perms.length ? '<span class="perms">'+perms.join(',')+'</span>' : '')
            + '</span>'
            + limitHtml;
        }).join('')
      : '<span style="color:var(--text3);font-size:11px;">Sin apps</span>';
    return '<tr>'
      + '<td><div class="pname">'+esc(p.display_name||p.username)+'</div><div class="pmeta">@'+esc(p.username)+'</div></td>'
      + '<td>'+roleBadge+'</td>'
      + '<td style="max-width:280px;">'+appTags+'</td>'
      + '<td>'+statusBadge+'</td>'
      + '<td class="text-sm" style="color:var(--text3);">'+(p.last_login ? relTime(p.last_login) : 'Nunca')+'</td>'
      + '<td><div style="display:flex;gap:4px;">'
        + '<button class="btn btn-secondary btn-sm" onclick="openLimits(\''+p.id+'\',\''+esc(p.display_name||p.username)+'\')">Limites</button>'
        + '<button class="btn btn-secondary btn-sm" onclick="editPartner(\''+p.id+'\')">Editar</button>'
        + '<button class="btn btn-danger btn-sm" onclick="delPartner(\''+p.id+'\',\''+esc(p.username)+'\')">Eliminar</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');
}

function buildAppPerms(containerId, selectedApps) {
  var el = document.getElementById(containerId);
  if (!allApps.length) {
    el.innerHTML = '<p style="color:var(--text3);font-size:12px;padding:8px;">Sin apps disponibles. Crea una app primero.</p>';
    return;
  }
  el.innerHTML = allApps.map(function(a) {
    var sel = selectedApps.find(function(s){ return s.id === a.id || s.app_id === a.id; }) || {};
    var isChecked = !!sel.id || !!sel.app_id;
    var ck = isChecked ? (sel.can_genkeys !== undefined ? sel.can_genkeys : 1) : 1;
    var cu = isChecked ? (sel.can_users   !== undefined ? sel.can_users   : 1) : 1;
    var cl = isChecked ? (sel.can_logs    !== undefined ? sel.can_logs    : 1) : 1;
    var kl = isChecked ? (sel.key_limit   || 0) : 0;
    return '<div class="app-perm-row'+(isChecked?'':' disabled')+'" id="apr-'+containerId+'-'+a.id+'">'
      + '<div>'
        + '<div style="display:flex;align-items:center;gap:8px;">'
          + '<strong style="font-size:13px;color:var(--text);">'+esc(a.name)+'</strong>'
          + (a.version ? '<span class="badge badge-yellow" style="font-size:9px;">v'+esc(a.version)+'</span>' : '')
        + '</div>'
        + '<div class="perm-checks" id="perms-'+containerId+'-'+a.id+'" style="'+(isChecked?'':'display:none;')+'">'
          + '<label class="perm-check-item"><input type="checkbox" id="perm-genkeys-'+containerId+'-'+a.id+'" '+(ck?'checked':'')+'> Generar Keys</label>'
          + '<label class="perm-check-item"><input type="checkbox" id="perm-users-'+containerId+'-'+a.id+'"   '+(cu?'checked':'')+'> Ver Usuarios</label>'
          + '<label class="perm-check-item"><input type="checkbox" id="perm-logs-'+containerId+'-'+a.id+'"    '+(cl?'checked':'')+'> Ver Logs</label>'
          + '<div class="key-limit-wrap">Limite de keys: <input type="number" id="keylimit-'+containerId+'-'+a.id+'" class="key-limit-inp" value="'+kl+'" min="0" placeholder="0=ilimitado"> <span style="font-size:10px;">(0=sin limite)</span></div>'
        + '</div>'
      + '</div>'
      + '<button class="toggle-app-btn'+(isChecked?' active':'')+'" id="togglebtn-'+containerId+'-'+a.id+'" onclick="toggleApp(\''+containerId+'\',\''+a.id+'\')" title="'+(isChecked?'Quitar':'Asignar')+'">'
        + (isChecked ? '&#10003;' : '+')
      + '</button>'
    + '</div>';
  }).join('');
}

function toggleApp(containerId, appId) {
  var btn  = document.getElementById('togglebtn-'+containerId+'-'+appId);
  var perms = document.getElementById('perms-'+containerId+'-'+appId);
  var row  = document.getElementById('apr-'+containerId+'-'+appId);
  var isOn = btn.classList.contains('active');
  if (isOn) {
    btn.classList.remove('active'); btn.innerHTML = '+'; btn.title = 'Asignar';
    row.classList.add('disabled');
    if (perms) perms.style.display = 'none';
  } else {
    btn.classList.add('active'); btn.innerHTML = '&#10003;'; btn.title = 'Quitar';
    row.classList.remove('disabled');
    if (perms) perms.style.display = '';
  }
}

function getAppPerms(containerId) {
  var result = [];
  allApps.forEach(function(a) {
    var btn = document.getElementById('togglebtn-'+containerId+'-'+a.id);
    if (btn && btn.classList.contains('active')) {
      var gk = document.getElementById('perm-genkeys-'+containerId+'-'+a.id);
      var cu = document.getElementById('perm-users-'+containerId+'-'+a.id);
      var cl = document.getElementById('perm-logs-'+containerId+'-'+a.id);
      var kl = document.getElementById('keylimit-'+containerId+'-'+a.id);
      result.push({
        id:          a.id,
        can_genkeys: gk && gk.checked ? 1 : 0,
        can_users:   cu && cu.checked ? 1 : 0,
        can_logs:    cl && cl.checked ? 1 : 0,
        key_limit:   kl ? parseInt(kl.value) || 0 : 0
      });
    }
  });
  return result;
}

async function createPartner() {
  var username     = document.getElementById('new-username').value.trim();
  var password     = document.getElementById('new-password').value;
  var display_name = document.getElementById('new-display').value.trim();
  var role         = document.getElementById('new-role').value;
  if (!username || !password) { toast('Usuario y contrasena requeridos', 'error'); return; }
  var appPerms = getAppPerms('new-apps-list');
  var permsObj = {};
  appPerms.forEach(function(a){ permsObj[a.id] = a; });
  var res = await apiFetch(API + '/partners', {
    method: 'POST',
    body: { username, password, display_name, role, app_ids: appPerms.map(function(a){return a.id;}), permissions: permsObj }
  });
  if (res && res.success) {
    toast('Partner "'+username+'" creado', 'success');
    closeModal('modal-create');
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-display').value  = '';
    buildAppPerms('new-apps-list', []);
    loadPartners();
  } else if (res) toast(res.message, 'error');
}

async function editPartner(id) {
  var res = await apiFetch(API + '/partners');
  if (!res || !res.success) return;
  var p = res.partners.find(function(x){ return x.id === id; });
  if (!p) return;
  document.getElementById('edit-id').value       = p.id;
  document.getElementById('edit-username').value = p.username;
  document.getElementById('edit-display').value  = p.display_name || '';
  document.getElementById('edit-role').value     = p.role || 'partner';
  document.getElementById('edit-active').value   = p.active;
  document.getElementById('edit-password').value = '';
  buildAppPerms('edit-apps-list', p.apps || []);
  openModal('modal-edit');
}

async function saveEdit() {
  var id           = document.getElementById('edit-id').value;
  var display_name = document.getElementById('edit-display').value.trim();
  var role         = document.getElementById('edit-role').value;
  var active       = parseInt(document.getElementById('edit-active').value);
  var password     = document.getElementById('edit-password').value;
  var appPerms     = getAppPerms('edit-apps-list');
  var permsObj     = {};
  appPerms.forEach(function(a){ permsObj[a.id] = a; });
  var body = { display_name, role, active, app_ids: appPerms.map(function(a){return a.id;}), permissions: permsObj };
  if (password) body.password = password;
  var res = await apiFetch(API + '/partners/' + id, { method: 'PUT', body });
  if (res && res.success) { toast('Partner actualizado', 'success'); closeModal('modal-edit'); loadPartners(); }
  else if (res) toast(res.message, 'error');
}

async function delPartner(id, name) {
  confirmAction('Eliminar al partner "'+name+'"? Esta accion no se puede deshacer.', async function() {
    var res = await apiFetch(API + '/partners/' + id, { method: 'DELETE' });
    if (res && res.success) { toast('Partner eliminado', 'success'); loadPartners(); }
    else if (res) toast(res.message, 'error');
  });
}

async function openLimits(id, name) {
  document.getElementById('limits-pname').textContent = name;
  var res = await apiFetch(API + '/partners/' + id + '/limits');
  var body = document.getElementById('limits-body');
  if (!res || !res.success || !res.apps.length) {
    body.innerHTML = '<p style="padding:16px;color:var(--text3);font-size:13px;">Sin apps asignadas a este partner.</p>';
    openModal('modal-limits'); return;
  }
  body.innerHTML = res.apps.map(function(a) {
    var used = a.keys_used || 0;
    var lim  = a.key_limit || 0;
    var pct  = lim > 0 ? Math.min(100, Math.round((used/lim)*100)) : 0;
    var warn = pct >= 90;
    return '<div style="padding:14px 0;border-bottom:1px solid var(--border);">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        + '<span style="font-weight:700;color:var(--text);">'+esc(a.name)+'</span>'
        + '<div style="display:flex;gap:6px;">'
          + '<button class="btn btn-secondary btn-sm" onclick="resetLimit(\''+id+'\',\''+a.id+'\',this)">Reset contador</button>'
        + '</div>'
      + '</div>'
      + (lim > 0
        ? '<div style="font-size:11px;color:var(--text3);margin-bottom:4px;">'+used+' / '+lim+' keys generadas ('+pct+'%)</div>'
          + '<div class="limit-bar"><div class="limit-bar-fill'+(warn?' warn':'')+'" style="width:'+pct+'%"></div></div>'
        : '<div style="font-size:11px;color:var(--text3);">Sin limite (ilimitado)</div>')
    + '</div>';
  }).join('');
  openModal('modal-limits');
}

async function resetLimit(partnerId, appId, btn) {
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = '...';
  var res = await apiFetch(API + '/partners/' + partnerId + '/limits/' + appId + '/reset', { method: 'POST' });
  if (res && res.success) { toast('Contador reseteado', 'success'); loadPartners(); closeModal('modal-limits'); }
  else { if (res) toast(res.message, 'error'); btn.disabled = false; btn.textContent = orig; }
}

function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
