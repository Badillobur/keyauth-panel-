<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/admin/lmax27.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Partners & Sellers</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <style>
    /* Partners grid */
    .partners-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    .partner-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; transition:all .2s; }
    .partner-card:hover { border-color:rgba(234,179,8,.3); transform:translateY(-1px); }
    
    .partner-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .partner-name { font-size:16px; font-weight:800; color:var(--text); }
    .partner-role { padding:4px 10px; border-radius:20px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
    .role-partner { background:rgba(34,197,94,.15); color:#22c55e; border:1px solid rgba(34,197,94,.3); }
    .role-seller { background:rgba(234,179,8,.15); color:#eab308; border:1px solid rgba(234,179,8,.3); }
    .role-admin { background:rgba(99,102,241,.15); color:#6366f1; border:1px solid rgba(99,102,241,.3); }
    
    .partner-info { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:14px; }
    .partner-stat { display:flex; flex-direction:column; gap:2px; }
    .partner-stat-label { font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; }
    .partner-stat-value { font-size:14px; font-weight:700; color:var(--text2); }
    
    .partner-apps { margin-bottom:14px; }
    .partner-apps-title { font-size:11px; font-weight:800; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .partner-apps-list { display:flex; flex-wrap:wrap; gap:4px; }
    .partner-app-tag { background:var(--bg3); border:1px solid var(--border); padding:3px 8px; border-radius:12px; font-size:10px; color:var(--text3); }
    
    .partner-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .partner-btn { padding:6px 12px; border:1px solid var(--border); background:var(--bg3); color:var(--text2); border-radius:var(--radius); font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
    .partner-btn:hover { border-color:var(--accent); color:var(--text); background:var(--bg4); }
    .partner-btn.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:800; }
    .partner-btn.danger { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3); color:#ef4444; }
    .partner-btn.danger:hover { background:rgba(239,68,68,.2); }
    
    /* Stats row */
    .partners-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
    .partners-stat { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; text-align:center; }
    .partners-stat-val { font-size:26px; font-weight:900; color:var(--text); line-height:1; }
    .partners-stat-lbl { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.6px; margin-top:4px; }
    
    /* Search */
    .partners-search { width:100%; padding:10px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:13px; outline:none; transition:border-color .15s; margin-bottom:16px; }
    .partners-search:focus { border-color:rgba(234,179,8,.4); }
    .partners-search::placeholder { color:var(--text3); }
  </style>
</head>
<body>
<div id="particles"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Partners & Sellers</div>
        <div class="topbar-sub">Gestiona partners y vendedores de tu sistema</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btn-create-partner" onclick="openModal('modal-create-partner')">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
          Crear Partner
        </button>
      </div>
    </div>

    <div class="content">
      <!-- Stats -->
      <div class="partners-stats">
        <div class="partners-stat">
          <div class="partners-stat-val" id="stat-total">0</div>
          <div class="partners-stat-lbl">Total Partners</div>
        </div>
        <div class="partners-stat">
          <div class="partners-stat-val" id="stat-active">0</div>
          <div class="partners-stat-lbl">Activos</div>
        </div>
        <div class="partners-stat">
          <div class="partners-stat-val" id="stat-sellers">0</div>
          <div class="partners-stat-lbl">Owners</div>
        </div>
        <div class="partners-stat">
          <div class="partners-stat-val" id="stat-revenue">0</div>
          <div class="partners-stat-lbl">Total</div>
        </div>
      </div>

      <!-- Search -->
      <input type="text" class="partners-search" placeholder="Buscar partners..." oninput="filterPartners(this.value)" />
      
      <!-- Partners Grid -->
      <div class="partners-grid" id="partners-list">
        <div class="empty-state"><div class="loader"></div></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Crear Partner -->
<div class="modal-overlay" id="modal-create-partner">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Crear Nuevo Partner</div>
      <button class="modal-close" onclick="closeModal('modal-create-partner')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre de Usuario *</label>
      <input type="text" id="new-partner-username" class="form-control" placeholder="username" />
    </div>
    <div class="form-group">
      <label class="form-label">Email *</label>
      <input type="email" id="new-partner-email" class="form-control" placeholder="email@ejemplo.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña *</label>
      <input type="password" id="new-partner-password" class="form-control" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select id="new-partner-role" class="form-control" onchange="toggleNewMaxPartners(this.value)">
        <option value="partner">Partner</option>
        <option value="owner">Owner (puede crear sub-partners)</option>
      </select>
    </div>
    <div class="form-group" id="new-max-partners-group" style="display:none;">
      <label class="form-label">Max Sub-Partners que puede crear</label>
      <input type="number" id="new-partner-max-partners" class="form-control" placeholder="5" min="0" max="100" value="5" />
    </div>
    <div class="form-group" id="new-max-bots-group">
      <label class="form-label">Max Bots permitidos</label>
      <input type="number" id="new-partner-commission" class="form-control" placeholder="1" min="1" max="100" value="1" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-create-partner')">Cancelar</button>
      <button class="btn btn-primary" onclick="createPartner()">Crear Partner</button>
    </div>
  </div>
</div>

<!-- Modal Editar Partner -->
<div class="modal-overlay" id="modal-edit-partner">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Editar Partner</div>
      <button class="modal-close" onclick="closeModal('modal-edit-partner')">✕</button>
    </div>
    <input type="hidden" id="edit-partner-id" />
    <div class="form-group">
      <label class="form-label">Nombre de Usuario</label>
      <input type="text" id="edit-partner-username" class="form-control" />
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="edit-partner-email" class="form-control" />
    </div>
    <div class="form-group">
      <label class="form-label">Tipo de Partner</label>
      <select id="edit-partner-role" class="form-control" onchange="toggleEditMaxPartners(this.value)">
        <option value="partner">Partner</option>
        <option value="owner">Owner (puede crear sub-partners)</option>
      </select>
    </div>
    <div class="form-group" id="edit-max-partners-group" style="display:none;">
      <label class="form-label">Max Sub-Partners que puede crear</label>
      <input type="number" id="edit-partner-max-partners" class="form-control" min="0" max="100" value="0" />
    </div>
    <div class="form-group" id="edit-max-bots-group">
      <label class="form-label">Max Bots permitidos</label>
      <input type="number" id="edit-partner-commission" class="form-control" min="1" max="100" value="1" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-edit-partner')">Cancelar</button>
      <button class="btn btn-primary" onclick="savePartnerEdit()">Guardar Cambios</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/admin/js/app.js"></script>
<script src="/admin/js/sidebar.js"></script>
<script>
var partnersData = [];
var allApps = [];

function esc(s) { 
  if (!s) return ''; 
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); 
}

(async function() {
  injectSidebar('partners');
  var admin = await requireAuth();
  if (!admin) return;
  window._adminInfo = admin;

  var isOwner = admin.role === 'partner' && admin.partner_role === 'owner';
  var isSuperAdmin = admin.role === 'superadmin' || admin.role === 'admin';

  // Owner cannot create other owners — hide that option
  if (isOwner) {
    var ownerOpt = document.querySelector('#new-partner-role option[value="owner"]');
    if (ownerOpt) ownerOpt.remove();
    // Update button and title
    var titleEl = document.querySelector('#modal-create-partner .modal-title');
    if (titleEl) titleEl.textContent = 'Crear Sub-Partner';
    var topbarBtn = document.getElementById('btn-create-partner');
    if (topbarBtn) topbarBtn.textContent = '+ Crear Sub-Partner';
    // Hide max_bots field — sub-partners always get 1 bot, only admin can change this
    var maxBotsGroup = document.getElementById('new-max-bots-group');
    if (maxBotsGroup) maxBotsGroup.style.display = 'none';
    // Also hide max_bots in edit modal
    var editMaxBotsGroup = document.getElementById('edit-max-bots-group');
    if (editMaxBotsGroup) editMaxBotsGroup.style.display = 'none';
  }

  if (!isSuperAdmin && !isOwner) {
    // Plain partner — hide create button
    var btn = document.getElementById('btn-create-partner');
    if (btn) btn.style.display = 'none';
  }

  // Load apps for assignment dropdowns
  var ar = await apiFetch(API + '/apps');
  if (ar && ar.success) allApps = ar.apps;
  loadPartners();
})();

async function loadPartners() {
  var el = document.getElementById('partners-list');
  el.innerHTML = '<div class="empty-state"><div class="loader"></div></div>';
  var res = await apiFetch(API + '/partners');
  if (!res || !res.success) {
    el.innerHTML = '<div class="empty-state"><p>Error cargando partners</p></div>';
    return;
  }
  partnersData = res.partners || [];
  renderPartners(partnersData);
  updateStats();
}

function updateStats() {
  document.getElementById('stat-total').textContent   = partnersData.length;
  document.getElementById('stat-active').textContent  = partnersData.filter(function(p){ return p.active; }).length;
  document.getElementById('stat-sellers').textContent = partnersData.filter(function(p){ return p.role === 'owner'; }).length;
  document.getElementById('stat-revenue').textContent = partnersData.length + ' total';
}

function renderPartners(partners) {
  var el = document.getElementById('partners-list');
  if (!partners.length) {
    el.innerHTML = '<div class="empty-state"><p>No hay partners creados</p></div>';
    return;
  }
  el.innerHTML = partners.map(function(p) {
    var roleClass = p.role === 'owner' ? 'role-admin' : 'role-partner';
    var roleText  = p.role === 'owner' ? 'Owner' : 'Partner';
    var statusBadge = p.active
      ? '<span style="padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);">Activo</span>'
      : '<span style="padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);">Inactivo</span>';
    var appsList = (p.apps || []).map(function(a){ return '<span class="partner-app-tag">' + esc(a.name) + '</span>'; }).join('');
    var lastLogin = p.last_login ? new Date(p.last_login * 1000).toLocaleDateString() : 'Nunca';
    return '<div class="partner-card" data-name="' + esc(p.username).toLowerCase() + '">' +
      '<div class="partner-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div class="partner-name">' + esc(p.display_name || p.username) + '</div>' +
          statusBadge +
        '</div>' +
        '<div class="partner-role ' + roleClass + '">' + roleText + '</div>' +
      '</div>' +
      '<div class="partner-info">' +
        '<div class="partner-stat"><div class="partner-stat-label">Username</div><div class="partner-stat-value" style="font-family:monospace;">' + esc(p.username) + '</div></div>' +
        '<div class="partner-stat"><div class="partner-stat-label">Email</div><div class="partner-stat-value">' + esc(p.email || '—') + '</div></div>' +
        '<div class="partner-stat"><div class="partner-stat-label">Max Bots</div><div class="partner-stat-value">' + (p.max_bots || 1) + '</div></div>' +
        (p.role === 'owner' ? '<div class="partner-stat"><div class="partner-stat-label">Max Sub-Partners</div><div class="partner-stat-value">' + (p.max_partners || 0) + '</div></div>' : '') +
        '<div class="partner-stat"><div class="partner-stat-label">Último Login</div><div class="partner-stat-value">' + lastLogin + '</div></div>' +
      '</div>' +
      (appsList ? '<div class="partner-apps"><div class="partner-apps-title">Apps Asignadas</div><div class="partner-apps-list">' + appsList + '</div></div>' : '') +
      '<div class="partner-actions">' +
        '<button class="partner-btn primary" onclick="editPartner(\'' + p.id + '\')">' +
          '<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M7.5 1l2.5 2.5-6.5 6.5H1V7.5L7.5 1z" stroke="currentColor" stroke-width="1.2"/></svg>Editar' +
        '</button>' +
        '<button class="partner-btn" onclick="togglePartnerActive(\'' + p.id + '\',' + (p.active?0:1) + ')">' +
          (p.active ? 'Desactivar' : 'Activar') +
        '</button>' +
        '<button class="partner-btn danger" onclick="deletePartner(\'' + p.id + '\',\'' + esc(p.username) + '\')">' +
          '<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 3h8M4 3V2h3v1M3 3l.5 6.5h4L8 3" stroke="currentColor" stroke-width="1.2"/></svg>Eliminar' +
        '</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function filterPartners(query) {
  var q = query.toLowerCase();
  document.querySelectorAll('.partner-card').forEach(function(card) {
    card.style.display = card.dataset.name.includes(q) ? '' : 'none';
  });
}

async function createPartner() {
  var username     = document.getElementById('new-partner-username').value.trim();
  var email        = document.getElementById('new-partner-email').value.trim();
  var password     = document.getElementById('new-partner-password').value;
  var role         = document.getElementById('new-partner-role').value;
  var max_bots     = parseInt(document.getElementById('new-partner-commission').value) || 1;
  var max_partners = role === 'owner' ? (parseInt(document.getElementById('new-partner-max-partners').value) || 5) : 0;
  if (!username || !password) { toast('Username y contraseña son requeridos', 'error'); return; }

  var res = await apiFetch(API + '/partners', { method:'POST', body:{ username, email, password, role, max_bots, max_partners } });
  if (res && res.success) {
    toast('Partner "' + username + '" creado exitosamente', 'success');
    closeModal('modal-create-partner');
    document.getElementById('new-partner-username').value = '';
    document.getElementById('new-partner-email').value = '';
    document.getElementById('new-partner-password').value = '';
    document.getElementById('new-partner-commission').value = '1';
    document.getElementById('new-partner-max-partners').value = '5';
    loadPartners();
  } else if (res) {
    toast(res.message, 'error');
  }
}

function toggleNewMaxPartners(role) {
  var group = document.getElementById('new-max-partners-group');
  if (group) group.style.display = role === 'owner' ? '' : 'none';
}

function toggleEditMaxPartners(role) {
  var group = document.getElementById('edit-max-partners-group');
  if (group) group.style.display = role === 'owner' ? '' : 'none';
}

function editPartner(id) {
  var partner = partnersData.find(function(p){ return p.id === id; });
  if (!partner) return;
  var admin = window._adminInfo;
  var isOwner = admin && admin.role === 'partner' && admin.partner_role === 'owner';

  document.getElementById('edit-partner-id').value           = partner.id;
  document.getElementById('edit-partner-username').value     = partner.display_name || partner.username;
  document.getElementById('edit-partner-email').value        = partner.email || '';
  document.getElementById('edit-partner-role').value         = partner.role || 'partner';
  document.getElementById('edit-partner-commission').value   = partner.max_bots || 1;
  document.getElementById('edit-partner-max-partners').value = partner.max_partners || 0;
  toggleEditMaxPartners(partner.role || 'partner');

  // Owners cannot change max_bots of sub-partners — only admin can
  var editMaxBotsGroup = document.getElementById('edit-max-bots-group');
  if (editMaxBotsGroup) editMaxBotsGroup.style.display = isOwner ? 'none' : '';

  openModal('modal-edit-partner');
}

async function savePartnerEdit() {
  var id           = document.getElementById('edit-partner-id').value;
  var display_name = document.getElementById('edit-partner-username').value.trim();
  var email        = document.getElementById('edit-partner-email').value.trim();
  var role         = document.getElementById('edit-partner-role').value;
  var max_bots     = parseInt(document.getElementById('edit-partner-commission').value) || 1;
  var max_partners = role === 'owner' ? (parseInt(document.getElementById('edit-partner-max-partners').value) || 0) : 0;
  if (!display_name) { toast('El nombre es requerido', 'error'); return; }
  var res = await apiFetch(API + '/partners/' + id, { method:'PUT', body:{ display_name, email, role, max_bots, max_partners } });
  if (res && res.success) {
    toast('Partner actualizado', 'success');
    closeModal('modal-edit-partner');
    loadPartners();
  } else if (res) {
    toast(res.message, 'error');
  }
}

async function togglePartnerActive(id, newActive) {
  var res = await apiFetch(API + '/partners/' + id, { method:'PUT', body:{ active: newActive } });
  if (res && res.success) {
    toast(newActive ? 'Partner activado' : 'Partner desactivado', 'success');
    loadPartners();
  }
}

async function deletePartner(id, username) {
  confirmAction('¿Eliminar partner "' + username + '"? Se borrará su acceso.', async function() {
    var res = await apiFetch(API + '/partners/' + id, { method:'DELETE' });
    if (res && res.success) { toast('Partner eliminado', 'success'); loadPartners(); }
    else if (res) toast(res.message, 'error');
  });
}
</script>
</body>
</html>
