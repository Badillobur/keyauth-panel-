<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/admin/lmax27.png" type="image/png" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Usuarios</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
<div id="particles"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <div><div class="topbar-title">👥 Usuarios</div><div class="topbar-sub" id="topbar-sub">Gestiona usuarios de tus apps</div></div>
      <div class="topbar-actions">
        <select id="app-selector" class="form-control" style="min-width:180px;" onchange="onAppChange()"><option value="">Seleccionar App...</option></select>
        <button class="btn btn-primary" id="btn-add-user" disabled onclick="openModal('modal-create-user')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="5" r="3" stroke="#000" stroke-width="1.5"/><path d="M1 13c0-2.8 2.2-4.5 5-4.5M10 8.5v5M7.5 11H13" stroke="#000" stroke-width="1.5" stroke-linecap="round"/></svg>
          Crear Usuario
        </button>
      </div>
    </div>
    <div class="content">
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card"><div class="stat-icon">👥</div><div><div class="stat-value" id="us-total">0</div><div class="stat-label">Total</div></div></div>
        <div class="stat-card"><div class="stat-icon">🟢</div><div><div class="stat-value" id="us-active">0</div><div class="stat-label">Sub Activa</div></div></div>
        <div class="stat-card"><div class="stat-icon">🚫</div><div><div class="stat-value" id="us-banned">0</div><div class="stat-label">Baneados</div></div></div>
        <div class="stat-card"><div class="stat-icon">⏰</div><div><div class="stat-value" id="us-exp">0</div><div class="stat-label">Expirados</div></div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">👥 Lista de Usuarios</div>
          <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" class="search-input" id="search-users" placeholder="Buscar usuario..." /></div>
        </div>
        <div class="table-wrap">
          <table id="users-table">
            <thead><tr><th>Usuario</th><th>Email</th><th>IP</th><th>HWID</th><th>Suscripcion</th><th>Expira</th><th>Estado</th><th>Registro</th><th>Acciones</th></tr></thead>
            <tbody id="users-tbody"><tr><td colspan="9"><div class="empty-state"><p>Selecciona una app</p></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-create-user">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header"><div class="modal-title">Crear Usuario</div><button class="modal-close" onclick="closeModal('modal-create-user')">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Usuario *</label><input type="text" id="cu-username" class="form-control" placeholder="username" /></div>
      <div class="form-group"><label class="form-label">Contraseña *</label><input type="password" id="cu-password" class="form-control" placeholder="contraseña" /></div>
    </div>
    <div class="form-group"><label class="form-label">Email (opcional)</label><input type="email" id="cu-email" class="form-control" placeholder="email@ejemplo.com" /></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Duracion (dias, 0=permanente)</label><input type="number" id="cu-days" class="form-control" value="30" min="0" /></div>
      <div class="form-group"><label class="form-label">Nivel</label><select id="cu-level" class="form-control"><option value="1">Nivel 1 — Basic</option><option value="2">Nivel 2 — Premium</option><option value="3">Nivel 3 — VIP</option></select></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-create-user')">Cancelar</button><button class="btn btn-primary" onclick="createUser()">Crear Usuario</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-extend">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header"><div class="modal-title">⏳ Extender Suscripcion</div><button class="modal-close" onclick="closeModal('modal-extend')">✕</button></div>
    <input type="hidden" id="ext-uid" />
    <p style="color:var(--text3);font-size:12px;margin-bottom:14px;">Usuario: <strong id="ext-uname" style="color:var(--accent);"></strong></p>
    <div class="form-group"><label class="form-label">Dias a agregar</label><input type="number" id="ext-days" class="form-control" value="30" min="1" /></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-extend')">Cancelar</button><button class="btn btn-primary" onclick="doExtend()">Extender</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-ban">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header"><div class="modal-title">🚫 Banear Usuario</div><button class="modal-close" onclick="closeModal('modal-ban')">✕</button></div>
    <input type="hidden" id="ban-uid" />
    <p style="color:var(--text3);font-size:12px;margin-bottom:14px;">Usuario: <strong id="ban-uname" style="color:var(--accent);"></strong></p>
    <div class="form-group"><label class="form-label">Razon</label><input type="text" id="ban-reason" class="form-control" placeholder="Trampa, multi-cuenta..." /></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-ban')">Cancelar</button><button class="btn btn-danger" onclick="doBan()">Banear</button></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/admin/js/app.js"></script>
<script src="/admin/js/icons.js"></script><script src="/admin/js/sidebar.js"></script>
<script>
var currentAppId = null, usersData = [];
(async function() {
  injectSidebar('users');
  await requireAuth();
  await loadSel();
  filterTable('search-users','users-table');
  const a = getParam('app');
  if (a) { document.getElementById('app-selector').value=a; onAppChange(); }
})();

async function loadSel() {
  const r = await apiFetch(API+'/apps');
  if (!r||!r.success) return;
  const sel = document.getElementById('app-selector');
  r.apps.forEach(function(a){const o=document.createElement('option');o.value=a.id;o.textContent=a.name+' ('+a.userCount+')';sel.appendChild(o);});
}

function onAppChange() {
  const sel=document.getElementById('app-selector');
  currentAppId=sel.value||null;
  document.getElementById('btn-add-user').disabled = !currentAppId;
  if (currentAppId) { document.getElementById('topbar-sub').textContent=sel.options[sel.selectedIndex].text; loadUsers(currentAppId); }
}

async function loadUsers(appId) {
  const r = await apiFetch(API+'/apps/'+appId+'/users');
  const tbody = document.getElementById('users-tbody');
  if (!r||!r.success) { tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><p>Error</p></div></td></tr>'; return; }
  usersData=r.users;
  const now=Math.floor(Date.now()/1000);
  document.getElementById('us-total').textContent  = usersData.length;
  document.getElementById('us-banned').textContent = usersData.filter(function(u){return u.banned;}).length;
  document.getElementById('us-active').textContent = usersData.filter(function(u){return !u.banned&&u.sub_expiry&&u.sub_expiry>now;}).length;
  document.getElementById('us-exp').textContent    = usersData.filter(function(u){return !u.banned&&u.sub_expiry&&u.sub_expiry<now;}).length;
  if (!usersData.length) { tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">👥</div><p>Sin usuarios</p></div></td></tr>'; return; }
  tbody.innerHTML = usersData.map(function(u) {
    const exp=u.sub_expiry&&u.sub_expiry<now;
    const subBadge=u.banned?'—':!u.sub_expiry?'<span class="badge badge-blue">∞ Perm</span>':exp?'<span class="badge badge-red">Expirada</span>':'<span class="badge badge-green">Activa</span>';
    const stBadge=u.banned?'<span class="badge badge-red">Baneado</span>':'<span class="badge badge-green">OK</span>';
    const hwid=u.hwid&&u.hwid!==''?u.hwid.substring(0,10)+'...':'—';
    return '<tr><td class="td-main">'+esc(u.username)+'</td>'+
      '<td class="text-sm text-muted">'+esc(u.email||'—')+'</td>'+
      '<td class="font-mono text-sm text-muted">'+esc(u.ip||'—')+'</td>'+
      '<td class="font-mono text-sm text-muted" title="'+esc(u.hwid||'')+'">'+esc(hwid)+'</td>'+
      '<td>'+subBadge+'</td>'+
      '<td class="text-sm '+(exp?'text-danger':'text-muted')+'">'+fmtDateShort(u.sub_expiry)+'</td>'+
      '<td>'+stBadge+'</td>'+
      '<td class="text-sm text-muted">'+fmtDateShort(u.createdate)+'</td>'+
      '<td><div style="display:flex;gap:4px;">'+
        '<button class="btn btn-success btn-sm" title="Extender" onclick="openExtend(\''+u.id+'\',\''+esc(u.username)+'\')">⏳</button>'+
        '<button class="btn btn-secondary btn-sm" title="Reset HWID" onclick="resetHwid(\''+u.id+'\',\''+esc(u.username)+'\')">🖥️</button>'+
        '<button class="btn btn-'+(u.banned?'success':'danger')+' btn-sm" title="'+(u.banned?'Desbanear':'Banear')+'" onclick="'+(u.banned?'unban':'openBan')+'(\''+u.id+'\',\''+esc(u.username)+'\')">'+(u.banned?'✅':'🚫')+'</button>'+
        '<button class="btn btn-danger btn-sm" title="Eliminar" onclick="delUser(\''+u.id+'\',\''+esc(u.username)+'\')">🗑️</button>'+
      '</div></td></tr>';
  }).join('');
}

function openExtend(id,name){document.getElementById('ext-uid').value=id;document.getElementById('ext-uname').textContent=name;document.getElementById('ext-days').value=30;openModal('modal-extend');}

async function createUser() {
  if (!currentAppId) return;
  const username = document.getElementById('cu-username').value.trim();
  const password = document.getElementById('cu-password').value;
  const email    = document.getElementById('cu-email').value.trim();
  const days     = parseInt(document.getElementById('cu-days').value) || 0;
  const level    = document.getElementById('cu-level').value;
  if (!username || !password) { toast('Usuario y contraseña requeridos', 'error'); return; }
  const res = await apiFetch(API + '/apps/' + currentAppId + '/users', { method: 'POST', body: { username, password, email, days, level } });
  if (res && res.success) {
    toast(res.message, 'success');
    closeModal('modal-create-user');
    document.getElementById('cu-username').value = '';
    document.getElementById('cu-password').value = '';
    document.getElementById('cu-email').value = '';
    loadUsers(currentAppId);
  } else if (res) toast(res.message, 'error');
}
async function doExtend(){const r=await apiFetch(API+'/apps/'+currentAppId+'/users/'+document.getElementById('ext-uid').value+'/extend',{method:'POST',body:{days:parseInt(document.getElementById('ext-days').value)}});if(r&&r.success){toast(r.message,'success');closeModal('modal-extend');loadUsers(currentAppId);}else if(r)toast(r.message,'error');}
function openBan(id,name){document.getElementById('ban-uid').value=id;document.getElementById('ban-uname').textContent=name;document.getElementById('ban-reason').value='';openModal('modal-ban');}
async function doBan(){const r=await apiFetch(API+'/apps/'+currentAppId+'/users/'+document.getElementById('ban-uid').value+'/ban',{method:'POST',body:{reason:document.getElementById('ban-reason').value}});if(r&&r.success){toast(r.message,'success');closeModal('modal-ban');loadUsers(currentAppId);}else if(r)toast(r.message,'error');}
async function unban(id,name){confirmAction('¿Desbanear a '+name+'?',async function(){const r=await apiFetch(API+'/apps/'+currentAppId+'/users/'+id+'/ban',{method:'POST',body:{}});if(r&&r.success){toast(r.message,'success');loadUsers(currentAppId);}});}
async function resetHwid(id,name){confirmAction('¿Resetear HWID de '+name+'?',async function(){const r=await apiFetch(API+'/apps/'+currentAppId+'/users/'+id+'/reset-hwid',{method:'POST'});if(r&&r.success){toast('HWID reseteado','success');loadUsers(currentAppId);}});}
async function delUser(id,name){confirmAction('¿Eliminar usuario "'+name+'"?',async function(){const r=await apiFetch(API+'/apps/'+currentAppId+'/users/'+id,{method:'DELETE'});if(r&&r.success){toast('Eliminado','success');loadUsers(currentAppId);}});}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
</script>
</body>
</html>
