<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/admin/lmax27.png" type="image/png" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Logs</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
<div id="particles"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <div><div class="topbar-title">📋 Logs de Actividad</div><div class="topbar-sub" id="topbar-sub">Monitorea lo que pasa en tus apps</div></div>
      <div class="topbar-actions">
        <select id="app-selector" class="form-control" style="min-width:160px;" onchange="onAppChange()"><option value="">Seleccionar App...</option></select>
        <select id="limit-sel" class="form-control" style="width:110px;" onchange="reload()"><option value="50">50 logs</option><option value="100" selected>100 logs</option><option value="250">250 logs</option><option value="500">500 logs</option></select>
        <button class="btn btn-secondary btn-sm" id="btn-refresh" disabled onclick="reload()">🔄</button>
        <button class="btn btn-danger btn-sm" id="btn-clear" disabled onclick="clearLogs()">🗑️ Limpiar</button>
      </div>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-header">
          <div class="card-title">📋 Registros</div>
          <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" class="search-input" id="search-logs" placeholder="Buscar en logs..." /></div>
        </div>
        <div class="table-wrap">
          <table id="logs-table">
            <thead><tr><th>#</th><th>Accion</th><th>Usuario</th><th>IP</th><th>Hace</th></tr></thead>
            <tbody id="logs-tbody"><tr><td colspan="5"><div class="empty-state"><p>Selecciona una app</p></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
<script src="/admin/js/app.js"></script>
<script src="/admin/js/icons.js"></script><script src="/admin/js/sidebar.js"></script>
<script>
var currentAppId=null,total=0;
(async function(){
  injectSidebar('logs');
  await requireAuth();
  loadSelFromStorage();
  filterTable('search-logs','logs-table');
  var a=getParam('app');
  if(a){document.getElementById('app-selector').value=a;onAppChange();}
})();

function loadSelFromStorage() {
  var sel = document.getElementById('app-selector');
  sel.innerHTML = '<option value="">Seleccionar App...</option>';

  // Try API first to get fresh data
  apiFetch(API+'/apps').then(function(r) {
    if (r && r.success && r.apps && r.apps.length) {
      localStorage.setItem('lmax27_apps', JSON.stringify(r.apps));
      r.apps.forEach(function(a) {
        var o = document.createElement('option');
        o.value = a.id; o.textContent = a.name;
        sel.appendChild(o);
      });
    } else {
      // Fallback localStorage
      var saved = localStorage.getItem('lmax27_apps');
      if (saved) {
        try {
          JSON.parse(saved).forEach(function(a) {
            var o = document.createElement('option');
            o.value = a.id; o.textContent = a.name;
            sel.appendChild(o);
          });
        } catch(e) {}
      }
    }
    var savedId = localStorage.getItem('lmax_selected_app') || localStorage.getItem('selected_app_id');
    if (savedId) { sel.value = savedId; onAppChange(); }
  });
}
function onAppChange(){const sel=document.getElementById('app-selector');currentAppId=sel.value||null;const ok=!!currentAppId;document.getElementById('btn-refresh').disabled=!ok;document.getElementById('btn-clear').disabled=!ok;if(currentAppId){document.getElementById('topbar-sub').textContent=sel.options[sel.selectedIndex].text;loadLogs(currentAppId);}}
function reload(){if(currentAppId)loadLogs(currentAppId);}
async function loadLogs(appId){const limit=document.getElementById('limit-sel').value;const r=await apiFetch(API+'/apps/'+appId+'/logs?limit='+limit);const tbody=document.getElementById('logs-tbody');if(!r||!r.success){tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><p>Error</p></div></td></tr>';return;}if(!r.logs.length){tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📋</div><p>Sin logs</p></div></td></tr>';return;}total=r.logs.length;tbody.innerHTML=r.logs.map(function(l,i){const a=(l.action||'').toLowerCase();let color='var(--text3)';if(a.includes('login'))color='var(--green)';else if(a.includes('ban')||a.includes('bloquead'))color='var(--red)';else if(a.includes('registro'))color='var(--accent)';else if(a.includes('licencia')||a.includes('key'))color='#f59e0b';return'<tr><td class="text-muted text-sm">'+(total-i)+'</td><td style="color:'+color+';font-size:12px;max-width:300px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+color+';margin-right:8px;vertical-align:middle;box-shadow:0 0 5px '+color+'40;"></span>'+esc(l.action)+'</td><td class="text-sm font-mono text-muted">'+esc(l.username||'system')+'</td><td class="text-sm font-mono text-muted">'+esc(l.ip||'—')+'</td><td class="text-sm text-muted" title="'+fmtDate(l.created_at)+'">'+relTime(l.created_at)+'</td></tr>';}).join('');}
async function clearLogs(){if(!currentAppId)return;confirmAction('¿Eliminar TODOS los logs?',async function(){const r=await apiFetch(API+'/apps/'+currentAppId+'/logs',{method:'DELETE'});if(r&&r.success){toast('Logs eliminados','success');loadLogs(currentAppId);}});}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
