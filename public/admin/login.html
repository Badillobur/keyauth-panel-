<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — KeyAuth Panel</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #6c63ff, #4f46e5);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 14px;
      box-shadow: 0 0 32px rgba(108,99,255,0.4);
    }

    .login-logo h1 { font-size: 24px; font-weight: 800; color: var(--text); }
    .login-logo p  { font-size: 13px; color: var(--text3); margin-top: 4px; }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .login-card h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .login-card .sub {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 24px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-icon-wrap .icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 15px;
      pointer-events: none;
    }

    .input-icon-wrap .form-control {
      padding-left: 38px;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      background: linear-gradient(135deg, #6c63ff, #4f46e5);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px;
    }

    .btn-login:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .error-msg.show { display: flex; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text3);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="icon">🔐</div>
      <h1>KeyAuth Panel</h1>
      <p>Sistema de Licenciamiento</p>
    </div>

    <div class="login-card">
      <h2>Iniciar Sesion</h2>
      <p class="sub">Ingresa tus credenciales de administrador</p>

      <div class="error-msg" id="error-msg">
        <span>⚠</span>
        <span id="error-text">Error</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <div class="input-icon-wrap">
            <span class="icon">👤</span>
            <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div class="input-icon-wrap">
            <span class="icon">🔑</span>
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span id="btn-text">Entrar al Panel</span>
          <span id="btn-loader" style="display:none"><span class="loader" style="width:16px;height:16px;border-width:2px;"></span></span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      KeyAuth Panel v1.0 — Sistema de Licenciamiento
    </div>
  </div>

  <div id="toast-container"></div>
    <script>
    // Sin login - redirigir directo al panel
    window.location.href = '/admin/index.html';
    </script>
</body>
</html>
