<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Login</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-wrap { width:100%; max-width:380px; padding:20px; position:relative; z-index:1; }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo .icon { width:70px; height:70px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; box-shadow:0 0 40px var(--accent-glow), 0 8px 24px rgba(0,0,0,0.5); animation:pulseLogo 3s ease infinite; }
    .login-logo h1 { font-size:28px; font-weight:900; color:var(--accent); letter-spacing:2px; text-shadow:0 0 30px var(--accent-glow); }
    .login-logo p  { font-size:12px; color:var(--text3); margin-top:4px; letter-spacing:1px; text-transform:uppercase; }
    .login-card { background:var(--bg2); border:1px solid rgba(245,197,24,0.2); border-radius:var(--radius-lg); padding:30px; box-shadow:var(--shadow), 0 0 40px rgba(245,197,24,0.08); }
    .login-card h2 { font-size:16px; font-weight:800; color:var(--text); margin-bottom:4px; }
    .login-card .sub { font-size:12px; color:var(--text3); margin-bottom:22px; }
    .input-wrap { position:relative; }
    .input-wrap .ico { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:14px; pointer-events:none; }
    .input-wrap .form-control { padding-left:36px; }
    .btn-login { width:100%; padding:12px; font-size:13px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#000; border:none; border-radius:var(--radius); font-weight:800; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; letter-spacing:0.5px; margin-top:6px; box-shadow:0 4px 20px var(--accent-glow); }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(245,197,24,0.4); }
    .btn-login:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .err { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); color:#f87171; border-radius:var(--radius); padding:10px 14px; font-size:12px; margin-bottom:14px; display:none; align-items:center; gap:8px; }
    .err.show { display:flex; }
    .login-footer { text-align:center; margin-top:22px; font-size:11px; color:var(--text3); }
  </style>
</head>
<body>
<div id="particles"></div>
<div class="login-wrap">
  <div class="login-logo">
    <div class="icon">⚡</div>
    <h1>LMAx27</h1>
    <p>Sistema de Licenciamiento</p>
  </div>
  <div class="login-card">
    <h2>Acceder al Panel</h2>
    <p class="sub">Ingresa tus credenciales de administrador</p>
    <div class="err" id="err"><span>⚠</span><span id="err-text"></span></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <div class="input-wrap">
          <span class="ico">👤</span>
          <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrap">
          <span class="ico">🔒</span>
          <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" class="btn-login" id="login-btn">
        <span id="btn-text">⚡ Entrar</span>
        <span id="btn-loader" style="display:none"><span class="loader" style="width:14px;height:14px;border-width:2px;"></span></span>
      </button>
    </form>
  </div>
  <div class="login-footer">LMAx27 Panel v2.0 — Sistema de Licenciamiento</div>
</div>
<div id="toast-container"></div>
<script src="/admin/js/app.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const btnText = document.getElementById('btn-text');
  const btnLoader = document.getElementById('btn-loader');
  const errEl = document.getElementById('err');
  btn.disabled = true; btnText.style.display = 'none'; btnLoader.style.display = 'block';
  errEl.classList.remove('show');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({username, password}) });
  const data = await res.json();
  btn.disabled = false; btnText.style.display = 'block'; btnLoader.style.display = 'none';
  if (data.success) {
    setToken(data.token);
    toast('Login exitoso!', 'success');
    setTimeout(function() { window.location.href = '/admin/index.html'; }, 600);
  } else {
    document.getElementById('err-text').textContent = data.message || 'Credenciales invalidas';
    errEl.classList.add('show');
  }
});
</script>
</body>
</html>
