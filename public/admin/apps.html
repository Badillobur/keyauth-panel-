<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Aplicaciones</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
<div id="particles"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <div><div class="topbar-title">Aplicaciones</div><div class="topbar-sub">Gestiona tus apps y credenciales</div></div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openModal('modal-create')">+ Nueva App</button>
      </div>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-header">
          <div class="card-title">📦 Todas las Aplicaciones</div>
          <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" class="search-input" id="search-apps" placeholder="Buscar..." /></div>
        </div>
        <div class="table-wrap">
          <table id="apps-table">
            <thead><tr><th>Nombre</th><th>Version</th><th>Usuarios</th><th>Keys</th><th>Estado</th><th>Creada</th><th>Acciones</th></tr></thead>
            <tbody id="apps-tbody"><tr><td colspan="7"><div class="empty-state"><div class="loader"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-create">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">⚡ Nueva Aplicación</div><button class="modal-close" onclick="closeModal('modal-create')">✕</button></div>
    <div class="form-group"><label class="form-label">Nombre *</label><input type="text" id="new-app-name" class="form-control" placeholder="Mi Cheat v2" /></div>
    <div class="form-group"><label class="form-label">Versión</label><input type="text" id="new-app-version" class="form-control" value="1.0" /></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-create')">Cancelar</button><button class="btn btn-primary" onclick="createApp()">Crear App</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-edit">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">✏️ Editar App</div><button class="modal-close" onclick="closeModal('modal-edit')">✕</button></div>
    <input type="hidden" id="edit-id" />
    <div class="form-group"><label class="form-label">Nombre</label><input type="text" id="edit-name" class="form-control" /></div>
    <div class="form-group"><label class="form-label">Versión</label><input type="text" id="edit-version" class="form-control" /></div>
    <div class="form-group"><label class="form-label">Estado</label><select id="edit-status" class="form-control"><option value="1">Activa</option><option value="0">Desactivada</option></select></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-edit')">Cancelar</button><button class="btn btn-primary" onclick="saveEdit()">Guardar</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-creds">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header"><div class="modal-title">🔐 Credenciales</div><button class="modal-close" onclick="closeModal('modal-creds')">✕</button></div>
    <p style="color:var(--text3);font-size:12px;margin-bottom:14px;">Copia estos datos para tu código C++.</p>
    <div class="form-group"><label class="form-label">Nombre (name)</label><div class="code-block" id="cred-name"></div></div>
    <div class="form-group"><label class="form-label">Owner ID</label><div class="code-block" id="cred-ownerid"></div></div>
    <div class="form-group"><label class="form-label">Secret</label><div class="code-block" id="cred-secret"></div></div>
    <div class="form-group"><label class="form-label">URL API</label><div class="code-block" id="cred-url"></div></div>
    <div class="form-group">
      <label class="form-label">Código C++ listo</label>
      <div class="code-block" style="font-size:11px;line-height:1.7;white-space:pre;padding-right:80px;" id="cred-cpp"></div>
      <button class="copy-btn" style="top:28px;" onclick="copyText(document.getElementById('cred-cpp').dataset.raw, this)">Copiar</button>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal('modal-creds')">Cerrar</button></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/admin/js/app.js"></script>
<script src="/admin/js/icons.js"></script>
<script src="/admin/js/sidebar.js"></script>
<script>
(async function() {
  injectSidebar('apps');
  await requireAuth();
  loadApps();
  filterTable('search-apps', 'apps-table');
  const id = getParam('id');
  if (id) setTimeout(async function() {
    const r = await apiFetch(API + '/apps');
    if (r && r.success) { const a = r.apps.find(function(x) { return x.id === id; }); if (a) showCreds(a); }
  }, 500);
})();

async function loadApps() {
  const res = await apiFetch(API + '/apps');
  const tbody = document.getElementById('apps-tbody');
  if (!res || !res.success) { tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>Error cargando apps</p></div></td></tr>'; return; }
  if (!res.apps.length) { tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📦</div><p>No hay apps. Crea una!</p></div></td></tr>'; return; }
  tbody.innerHTML = res.apps.map(function(a) {
    return '<tr><td class="td-main">' + esc(a.name) + '</td>' +
      '<td><span class="badge badge-yellow">v'+esc(a.version)+'</span></td>' +
      '<td>'+a.userCount+'</td><td>'+a.keyCount+'</td>' +
      '<td>'+(a.status?'<span class="badge badge-green">Activa</span>':'<span class="badge badge-red">Off</span>')+'</td>' +
      '<td class="text-sm text-muted">'+fmtDateShort(a.created_at)+'</td>' +
      '<td><div style="display:flex;gap:5px;">' +
        '<button class="btn btn-secondary btn-sm" onclick="showCreds('+JSON.stringify(a).replace(/"/g,"&quot;")+')">🔐</button>' +
        '<a href="/admin/keys.html?app='+a.id+'" class="btn btn-secondary btn-sm">🔑</a>' +
        '<a href="/admin/users.html?app='+a.id+'" class="btn btn-secondary btn-sm">👥</a>' +
        '<button class="btn btn-secondary btn-sm" onclick="editApp('+JSON.stringify(a).replace(/"/g,"&quot;")+')">✏️</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteApp(\''+a.id+'\',\''+esc(a.name)+'\')">🗑️</button>' +
      '</div></td></tr>';
  }).join('');
}

async function createApp() {
  const name = document.getElementById('new-app-name').value.trim();
  const version = document.getElementById('new-app-version').value.trim() || '1.0';
  if (!name) { toast('Nombre requerido', 'error'); return; }
  const res = await apiFetch(API + '/apps', { method:'POST', body:{name, version} });
  if (!res) return;
  if (res.success) { toast('App "'+name+'" creada!', 'success'); closeModal('modal-create'); document.getElementById('new-app-name').value=''; loadApps(); showCreds(res.app); }
  else toast(res.message, 'error');
}

function editApp(app) {
  document.getElementById('edit-id').value = app.id;
  document.getElementById('edit-name').value = app.name;
  document.getElementById('edit-version').value = app.version;
  document.getElementById('edit-status').value = app.status;
  openModal('modal-edit');
}

async function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('edit-name').value.trim();
  const version = document.getElementById('edit-version').value.trim();
  const status = parseInt(document.getElementById('edit-status').value);
  const res = await apiFetch(API + '/apps/' + id, { method:'PUT', body:{name, version, status} });
  if (res && res.success) { toast('Actualizada', 'success'); closeModal('modal-edit'); loadApps(); }
  else if (res) toast(res.message, 'error');
}

async function deleteApp(id, name) {
  confirmAction('¿Eliminar "'+name+'"? Se borraran todos sus datos.', async function() {
    const res = await apiFetch(API + '/apps/' + id, { method:'DELETE' });
    if (res && res.success) { toast('App eliminada', 'success'); loadApps(); }
  });
}

function showCreds(app) {
  const apiUrl = window.location.origin + '/api/1.2/';
  document.getElementById('cred-name').textContent = app.name;
  document.getElementById('cred-ownerid').textContent = app.owner_id;
  document.getElementById('cred-secret').textContent = app.secret;
  document.getElementById('cred-url').textContent = apiUrl;
  const cpp = 'std::string name    = XorStr("'+app.name+'").c_str();\nstd::string ownerid = XorStr("'+app.owner_id+'").c_str();\nstd::string secret  = XorStr("'+app.secret+'").c_str();\nstd::string version = XorStr("'+app.version+'").c_str();\nstd::string url     = XorStr("'+apiUrl+'").c_str();';
  const cppEl = document.getElementById('cred-cpp');
  cppEl.textContent = cpp;
  cppEl.dataset.raw = cpp;
  openModal('modal-creds');
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); }
</script>
</body>
</html>
