<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/admin/lmax27.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMAx27 — Licenses</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
  <div id="particles"></div>
  <div class="layout">
    <div id="sidebar-container"></div>
    <main class="main">
      <!-- Header -->
      <div class="topbar">
        <div>
          <div class="topbar-title">Licenses</div>
          <div class="topbar-sub" id="app-name">Manage your licenses for your projects</div>
        </div>
        <div class="topbar-actions" style="display:flex;gap:12px;">
          <button class="btn btn-secondary" onclick="window.location.href='/apps'" style="display:flex;align-items:center;gap:8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Change App
          </button>
          <button class="btn btn-primary" id="btn-create" onclick="openCreateModal()" style="background:linear-gradient(135deg,#eab308,#ca8a04);border:none;display:flex;align-items:center;gap:8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Create License
          </button>
        </div>
      </div>

      <div class="content">
        <!-- Toolbar -->
        <div class="card" style="padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;gap:12px;">
            <button class="btn btn-secondary btn-sm" onclick="exportSelected()" style="display:flex;align-items:center;gap:6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              Export
            </button>
            <button class="btn btn-secondary btn-sm" onclick="bulkCopy()" style="display:flex;align-items:center;gap:6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              Copy
            </button>
            <button class="btn btn-secondary btn-sm" onclick="refreshLicenses()" style="display:flex;align-items:center;gap:6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
              Refresh
            </button>
            <button class="btn btn-danger btn-sm" onclick="deleteSelected()" style="display:flex;align-items:center;gap:6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              Delete
            </button>
          </div>
          
          <div class="search-wrap">
            <span class="search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </span>
            <input type="text" class="search-input" id="search-input" placeholder="Search Licenses..." oninput="filterTable()" />
          </div>
        </div>

        <!-- Table -->
        <div class="card">
          <div class="table-wrap">
            <table id="licenses-table" style="width:100%;">
              <thead>
                <tr style="background:var(--bg3);">
                  <th style="padding:12px 16px;width:40px;">
                    <input type="checkbox" id="select-all" onchange="toggleSelectAll()" style="cursor:pointer;" />
                  </th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">LICENSE</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">SUBSCRIPTION</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">GENERATED BY</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">CREATED AT</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">USED AT</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">USED ON</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">DURATION</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">NOTE</th>
                  <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);">USED</th>
                </tr>
              </thead>
              <tbody id="licenses-tbody">
                <tr>
                  <td colspan="10" style="padding:60px;text-align:center;">
                    <div class="empty-state">
                      <p style="color:var(--text3);font-size:15px;">No licenses yet. Create your first one!</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <div class="card" style="padding:16px 20px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:14px;color:var(--text2);">
            Showing page <strong id="page-current">1</strong> of <strong id="page-total">1</strong>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" id="btn-prev" disabled>Previous</button>
            <button class="btn btn-secondary btn-sm" id="btn-next" disabled>Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Create License -->
  <div class="modal-overlay" id="modal-create">
    <div class="modal" style="max-width:580px;">
      <div class="modal-header">
        <div class="modal-title">Create a new license</div>
        <button class="modal-close" onclick="closeModal('modal-create')">×</button>
      </div>
      
      <div style="padding:24px 28px;">
        <div class="form-group">
          <label class="form-label">License Amount <span style="color:#ef4444;">*</span></label>
          <input type="number" id="gen-amount" class="form-control" value="1" min="1" max="500" />
        </div>
        
        <div class="form-group">
          <label class="form-label">License Mask <span style="color:#ef4444;">*</span></label>
          <input type="text" id="gen-mask" class="form-control" value="*****-*****" placeholder="*****-*****" style="font-family:monospace;" />
          <div class="form-hint">Use * for random characters. Example: KEY-*****-*****</div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Subscription <span style="color:#ef4444;">*</span></label>
          <select id="gen-subscription" class="form-control">
            <option value="ByPassMega">ByPassMega</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">License Note</label>
          <input type="text" id="gen-note" class="form-control" placeholder="Note for the license..." />
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label class="form-label">Expiry Unit <span style="color:#ef4444;">*</span></label>
            <select id="gen-unit" class="form-control">
              <option value="seconds">Seconds</option>
              <option value="minutes">Minutes</option>
              <option value="hours">Hours</option>
              <option value="days" selected>Days</option>
              <option value="weeks">Weeks</option>
              <option value="months">Months</option>
              <option value="years">Years</option>
              <option value="lifetime">Lifetime</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Expiry Duration <span style="color:#ef4444;">*</span></label>
            <input type="number" id="gen-duration" class="form-control" value="1" min="0" />
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-create')">Cancel</button>
        <button class="btn btn-primary" onclick="createLicense()" style="background:linear-gradient(135deg,#eab308,#ca8a04);border:none;">Create License</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/admin/js/app.js"></script>
  <script src="/admin/js/icons.js"></script>
  <script src="/admin/js/sidebar.js"></script>
  <script>
    var currentAppId = null;
    var licensesData = [];
    var selectedLicenses = new Set();

    (async function() {
      injectSidebar('keys');
      await requireAuth();
      
      const savedApp = localStorage.getItem('selected_app_id');
      if (savedApp) {
        currentAppId = savedApp;
        
        // Get app name
        const ar = await apiFetch(API + '/apps');
        if (ar && ar.success) {
          const found = ar.apps.find(function(a) { return a.id === savedApp; });
          if (found) document.getElementById('app-name').textContent = found.name;
        }
        
        loadLicenses(currentAppId);
      } else {
        document.getElementById('licenses-tbody').innerHTML = '<tr><td colspan="10" style="padding:60px;text-align:center;"><div class="empty-state"><p style="color:var(--text3);">No app selected. Go to <a href="/apps" style="color:#eab308;">Applications</a> and select one.</p></div></td></tr>';
      }
    })();

    async function loadLicenses(appId) {
      const r = await apiFetch(API + '/apps/' + appId + '/keys');
      if (!r || !r.success) {
        document.getElementById('licenses-tbody').innerHTML = '<tr><td colspan="10" style="padding:60px;text-align:center;"><div class="empty-state"><p style="color:var(--text3);">Error loading licenses</p></div></td></tr>';
        return;
      }
      
      licensesData = r.keys || [];
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('licenses-tbody');
      if (!licensesData.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="padding:60px;text-align:center;"><div class="empty-state"><p style="color:var(--text3);font-size:15px;">No licenses yet. Create your first one!</p></div></td></tr>';
        return;
      }

      tbody.innerHTML = licensesData.map(function(k) {
        const isUsed = k.used > 0;
        const checked = selectedLicenses.has(k.id) ? 'checked' : '';
        
        return '<tr style="border-bottom:1px solid rgba(255,255,255,0.03);">' +
          '<td style="padding:14px 16px;"><input type="checkbox" ' + checked + ' onchange="toggleSelect(\'' + k.id + '\')" style="cursor:pointer;" /></td>' +
          '<td style="padding:14px 16px;font-family:monospace;font-size:12px;color:var(--text);font-weight:600;">' + esc(k.key_value) + '</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:#eab308;font-weight:600;">ByPassMega</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:#eab308;font-weight:600;">LMAx27</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:var(--text2);">' + formatDate(k.created_at) + '</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:var(--text2);">' + (k.used_at ? formatDate(k.used_at) : '-') + '</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:var(--text3);">' + (k.used_by || 'Not used') + '</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:var(--text2);">' + (k.duration ? k.duration + ' Day(s)' : 'Lifetime') + '</td>' +
          '<td style="padding:14px 16px;font-size:12px;color:var(--text3);">' + (k.note || '-') + '</td>' +
          '<td style="padding:14px 16px;"><span style="padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;background:' + (isUsed ? 'rgba(251,191,36,0.15)' : 'rgba(34,197,94,0.15)') + ';color:' + (isUsed ? '#fbbf24' : '#22c55e') + ';border:1px solid ' + (isUsed ? 'rgba(251,191,36,0.3)' : 'rgba(34,197,94,0.3)') + ';">' + (isUsed ? 'USED' : 'UNUSED') + '</span></td>' +
          '</tr>';
      }).join('');
    }

    function toggleSelect(id) {
      if (selectedLicenses.has(id)) {
        selectedLicenses.delete(id);
      } else {
        selectedLicenses.add(id);
      }
      renderTable();
      updateSelectAll();
    }

    function toggleSelectAll() {
      const checkbox = document.getElementById('select-all');
      if (checkbox.checked) {
        licensesData.forEach(function(k) { selectedLicenses.add(k.id); });
      } else {
        selectedLicenses.clear();
      }
      renderTable();
    }

    function updateSelectAll() {
      const checkbox = document.getElementById('select-all');
      checkbox.checked = licensesData.length > 0 && selectedLicenses.size === licensesData.length;
    }

    function openCreateModal() {
      document.getElementById('modal-create').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    async function createLicense() {
      if (!currentAppId) return toast('No app selected', 'error');
      
      const amount = parseInt(document.getElementById('gen-amount').value) || 1;
      const mask = document.getElementById('gen-mask').value || '*****-*****';
      const subscription = document.getElementById('gen-subscription').value;
      const note = document.getElementById('gen-note').value;
      const unit = document.getElementById('gen-unit').value;
      const duration = parseInt(document.getElementById('gen-duration').value) || 0;
      
      let durationInDays = 0;
      if (unit === 'lifetime') {
        durationInDays = null;
      } else {
        const unitToDays = {
          'seconds': 1/86400, 'minutes': 1/1440, 'hours': 1/24,
          'days': 1, 'weeks': 7, 'months': 30, 'years': 365
        };
        durationInDays = Math.floor(duration * (unitToDays[unit] || 1));
      }
      
      const body = {
        amount: amount,
        prefix: mask,
        level: subscription === 'Premium' ? 2 : subscription === 'VIP' ? 3 : 1,
        note: note
      };
      
      if (durationInDays !== null && durationInDays > 0) body.duration = durationInDays;
      
      const r = await apiFetch(API + '/apps/' + currentAppId + '/keys', {method: 'POST', body: body});
      if (r && r.success) {
        toast(r.message || 'Licenses created successfully', 'success');
        closeModal('modal-create');
        loadLicenses(currentAppId);
        
        // Reset form
        document.getElementById('gen-amount').value = '1';
        document.getElementById('gen-mask').value = '*****-*****';
        document.getElementById('gen-subscription').value = 'ByPassMega';
        document.getElementById('gen-note').value = '';
        document.getElementById('gen-unit').value = 'days';
        document.getElementById('gen-duration').value = '1';
      } else if (r) {
        toast(r.message || 'Error creating licenses', 'error');
      }
    }

    function refreshLicenses() {
      if (currentAppId) {
        toast('Refreshing...', 'success');
        loadLicenses(currentAppId);
      }
    }

    function filterTable() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#licenses-tbody tr');
      rows.forEach(function(row) {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(search) ? '' : 'none';
      });
    }

    function exportSelected() {
      if (selectedLicenses.size === 0) return toast('Select licenses first', 'error');
      const selected = licensesData.filter(function(k) { return selectedLicenses.has(k.id); });
      const text = selected.map(function(k) { return k.key_value; }).join('\n');
      const blob = new Blob([text], {type: 'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'licenses-' + Date.now() + '.txt';
      a.click();
      toast('Exported ' + selected.length + ' licenses', 'success');
    }

    function bulkCopy() {
      if (selectedLicenses.size === 0) return toast('Select licenses first', 'error');
      const selected = licensesData.filter(function(k) { return selectedLicenses.has(k.id); });
      const text = selected.map(function(k) { return k.key_value; }).join('\n');
      navigator.clipboard.writeText(text).then(function() {
        toast('Copied ' + selected.length + ' licenses to clipboard', 'success');
      }).catch(function() {
        toast('Failed to copy to clipboard', 'error');
      });
    }

    async function deleteSelected() {
      if (selectedLicenses.size === 0) return toast('Select licenses first', 'error');
      if (!confirm('Delete ' + selectedLicenses.size + ' selected licenses? This action cannot be undone.')) return;
      
      let deleted = 0;
      for (const id of selectedLicenses) {
        const r = await apiFetch(API + '/apps/' + currentAppId + '/keys/' + id, {method: 'DELETE'});
        if (r && r.success) deleted++;
      }
      
      selectedLicenses.clear();
      toast('Deleted ' + deleted + ' licenses', 'success');
      loadLicenses(currentAppId);
    }

    function formatDate(timestamp) {
      if (!timestamp) return '-';
      const d = new Date(timestamp * 1000);
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + 
             pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function pad(n) { return n < 10 ? '0' + n : n; }
    function esc(s) { 
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); 
    }
  </script>
</body>
</html>
